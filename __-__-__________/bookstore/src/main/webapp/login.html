<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录 - 简易电子书店</title>
    <!-- 使用相对路径：直接访问 /bookstore/login.html 或由 /bookstore/login 转发过来时都能正确加载 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="login-box">
        <h2>用户登录</h2>

        <!-- 登录失败提示（由下方脚本控制显示） -->
        <div id="errorMsg" class="msg error" style="display:none">用户名或密码错误，请重新输入！</div>
        <!-- Cookie 回显提示 -->
        <div id="cookieMsg" class="msg info" style="display:none"></div>

        <!-- 登录表单：POST 方式提交给 LoginServlet（/login） -->
        <form action="login" method="post">
            <label>用户名：<input type="text" id="username" name="username" placeholder="请输入用户名" required></label>
            <label>密　码：<input type="password" name="password" placeholder="请输入密码" required></label>
            <label class="remember"><input type="checkbox" name="remember" value="yes"> 记住我的用户名（7天）</label>
            <button type="submit">登　录</button>
        </form>

        <p class="hint">测试账号：admin / 123456（或数据库 t_user 表中的账号）</p>
    </div>
    <div class="footer">Java Web 实验 · 基于会话跟踪技术的简易电子书店购物系统</div>
</div>

<script>
    /**
     * 读取指定名称的 Cookie。
     * document.cookie 的格式为 "name1=value1; name2=value2"，逐个遍历查找。
     * 服务器写入时用 URLEncoder 编码（空格变成 +），这里先把 + 还原再解码。
     */
    function getCookie(name) {
        var arr = document.cookie ? document.cookie.split(/;\s*/) : [];
        for (var i = 0; i < arr.length; i++) {
            var pos = arr[i].indexOf('=');
            if (pos > 0 && arr[i].substring(0, pos) === name) {
                try {
                    return decodeURIComponent(arr[i].substring(pos + 1).replace(/\+/g, ' '));
                } catch (e) {
                    return '';
                }
            }
        }
        return '';
    }

    // 页面加载时：如果浏览器中存在保存用户名的 Cookie，把用户名回显到输入框
    window.onload = function () {
        var name = getCookie('username');
        if (name) {
            document.getElementById('username').value = name;
            var tip = document.getElementById('cookieMsg');
            tip.textContent = '已从 Cookie 中读取到用户名：' + name;
            tip.style.display = 'block';
        }
        // 登录失败时 LoginServlet 使用请求转发回到本页面，地址栏仍是 .../login，据此显示错误提示
        if (/\/login(;[^\/]*)?$/.test(location.pathname)) {
            document.getElementById('errorMsg').style.display = 'block';
        }
    };
</script>
</body>
</html>
