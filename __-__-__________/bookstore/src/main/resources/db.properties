# ==============================================================
# 数据库连接配置（沿用上次实验的 MySQL 数据库）
# 请根据自己上次实验的数据库修改 url / username / password；
# 若表名或字段名与本项目不同，修改 UserDao、BookDao 中的 SQL 即可。
# jdbc.enabled=false 或数据库连接失败时，项目自动使用内置模拟数据，仍可正常运行。
# ==============================================================
jdbc.enabled=true
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/bookstore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=1500
jdbc.username=root
jdbc.password=123456
